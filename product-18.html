<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בדיקה45 - Kolbo Online</title>
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f4f0;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}
        /* HEADER */
        .site-header{background:#1c1c1c;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
        .site-header .logo{height:60px;border-radius:6px}
        .back-link{color:#c99b26;text-decoration:none;font-size:.88em;letter-spacing:.4px;white-space:nowrap;transition:color .15s}
        .back-link:hover{color:#e0b83a}
        .breadcrumb{background:#fff;border-bottom:1px solid #e4e2db;padding:9px 28px;font-size:.78em;color:#999}
        .breadcrumb a{color:#666;text-decoration:none}
        .breadcrumb a:hover{color:#c15317}
        /* LAYOUT */
        .product-wrap{max-width:1080px;margin:32px auto;padding:0 20px;display:grid;grid-template-columns:1fr 400px;gap:36px;flex:1}
        /* GALLERY */
        .gallery-col{}
        .gallery-main{background:#fff;border-radius:3px;overflow:hidden;aspect-ratio:4/3;cursor:zoom-in;border:1px solid #e4e2db}
        .gallery-main img{width:100%;height:100%;object-fit:contain;display:block;transition:opacity .15s}
        .gallery-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
        .thumb-item{width:68px;height:68px;border-radius:3px;overflow:hidden;cursor:pointer;border:2px solid #e4e2db;transition:border-color .15s;flex-shrink:0}
        .thumb-item.active,.thumb-item:hover{border-color:#c15317}
        .thumb-item img{width:100%;height:100%;object-fit:cover;display:block}
        /* INFO PANEL */
        .info-panel{background:#fff;border-radius:3px;padding:30px;display:flex;flex-direction:column;gap:18px;border:1px solid #e4e2db;align-self:start;position:sticky;top:20px}
        .label{font-size:.68em;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#aaa;margin-bottom:6px}
        .product-name{font-size:1.55em;font-weight:700;line-height:1.3;color:#111}
        .product-price{font-size:1.45em;font-weight:800;color:#c15317}
        .divider{height:1px;background:#ebe9e3;margin:2px 0}
        .product-desc{font-size:.93em;line-height:1.8;color:#555}
        .features-title{font-size:.78em;font-weight:700;color:#888;letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
        .features-list{list-style:none;display:flex;flex-direction:column;gap:7px}
        .features-list li{font-size:.9em;color:#333;display:flex;align-items:flex-start;gap:9px;line-height:1.5}
        .features-list li::before{content:'✓';color:#c15317;font-weight:700;flex-shrink:0;margin-top:2px}
        .wa-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#25d366;color:#fff;padding:14px 20px;border-radius:5px;text-decoration:none;font-weight:700;font-size:1em;transition:background .2s,transform .15s;margin-top:4px}
        .wa-btn:hover{background:#1fb855;transform:translateY(-1px)}
        /* EXTRA BLOCKS */
        .extra-blocks{max-width:1080px;margin:0 auto 40px;padding:0 20px;display:flex;flex-direction:column;gap:14px}
        .txt-block-free{background:#fff;border-right:3px solid #c99b26;padding:16px 20px;font-size:.92em;color:#444;line-height:1.8;border-radius:2px;border:1px solid #e4e2db;border-right-color:#c99b26}
        /* LIGHTBOX */
        .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:1000;align-items:center;justify-content:center}
        .lightbox.active{display:flex}
        .lightbox img{max-width:90vw;max-height:86vh;object-fit:contain;border-radius:3px;transition:opacity .15s}
        .lb-close{position:fixed;top:14px;right:14px;color:#fff;font-size:32px;cursor:pointer;line-height:1;background:rgba(255,255,255,.1);width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:3px;transition:background .15s}
        .lb-close:hover{background:rgba(255,255,255,.2)}
        .lb-arrow{position:fixed;top:50%;transform:translateY(-50%);color:#fff;font-size:26px;cursor:pointer;padding:14px 12px;background:rgba(255,255,255,.1);border-radius:3px;transition:background .15s;user-select:none;line-height:1}
        .lb-arrow:hover{background:rgba(255,255,255,.22)}
        .lb-prev{right:14px}
        .lb-next{left:14px}
        .lb-counter{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.6);font-size:.78em;background:rgba(0,0,0,.4);padding:4px 14px;border-radius:20px}
        footer{background:#1c1c1c;color:#555;text-align:center;padding:18px;font-size:.8em;margin-top:auto}
        @media(max-width:760px){
            .product-wrap{grid-template-columns:1fr;gap:20px;margin:16px auto}
            .info-panel{position:static;padding:20px}
            .product-name{font-size:1.25em}
            .thumb-item{width:56px;height:56px}
            .site-header{padding:12px 16px}
            .site-header .logo{height:48px}
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="back-link">→ חזרה לקטלוג</a>
        <img src="logokolbo.jpeg" alt="Kolbo" class="logo">
        <div style="width:110px"></div>
    </header>
    <div class="breadcrumb"><a href="index.html">קטלוג</a> / בדיקה45</div>

    <div class="product-wrap">
        <div class="gallery-col">
            <div class="gallery-main">
                <img id="main-img" src="https://raw.githubusercontent.com/haimchama/kolbo-catalog/main/product-18/WhatsApp%20Image%202026-04-14%20at%2023.48.07.jpeg" alt="בדיקה45" onclick="openLightbox(mainIdx)">
            </div>
            
        </div>
        <div class="info-panel">
            <div>
                <div class="label">מוצר</div>
                <h1 class="product-name">בדיקה45</h1>
            </div>
            
            <div class="divider"></div>
            <p class="product-desc">sd</p>
            
            <div class="divider"></div>
            <a href="https://wa.me/972502123209?text=%D7%A9%D7%9C%D7%95%D7%9D%2C%20%D7%94%D7%92%D7%A2%D7%AA%D7%99%20%D7%93%D7%A8%D7%9A%20%D7%94%D7%90%D7%AA%D7%A8%2C%20%D7%91%D7%A7%D7%A9%D7%A8%20%D7%9C%3A%20%D7%91%D7%93%D7%99%D7%A7%D7%9445" class="wa-btn">💬 צור קשר עם הספק</a>
        </div>
    </div>

    

    <div id="lightbox" class="lightbox">
        <span class="lb-close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="" alt="">
        <span class="lb-arrow lb-prev" onclick="lbNav(-1)">&#8250;</span>
        <span class="lb-arrow lb-next" onclick="lbNav(1)">&#8249;</span>
        <span class="lb-counter" id="lb-counter"></span>
    </div>
    <footer>© 2026 Kolbo Online - All Rights Reserved</footer>
    <script>
        var LB_IMGS=["https://raw.githubusercontent.com/haimchama/kolbo-catalog/main/product-18/WhatsApp%20Image%202026-04-14%20at%2023.48.07.jpeg"];
        var lbIdx=0,mainIdx=0;
        function setMain(idx){
            mainIdx=idx;
            var el=document.getElementById('main-img');
            el.style.opacity='0';
            el.src=LB_IMGS[idx]||'';
            el.onload=function(){el.style.opacity='1'};
            document.querySelectorAll('.thumb-item').forEach(function(t,i){t.classList.toggle('active',i===idx)});
        }
        function openLightbox(idx){lbIdx=idx;lbShow();document.getElementById('lightbox').classList.add('active');document.body.style.overflow='hidden';}
        function lbShow(){var img=document.getElementById('lightbox-img');img.style.opacity='0';img.src=LB_IMGS[lbIdx]||'';img.onload=function(){img.style.opacity='1'};document.getElementById('lb-counter').textContent=(lbIdx+1)+' / '+LB_IMGS.length;}
        function lbNav(d){lbIdx=(lbIdx+d+LB_IMGS.length)%LB_IMGS.length;lbShow();}
        function closeLightbox(){document.getElementById('lightbox').classList.remove('active');document.body.style.overflow='';}
        document.addEventListener('keydown',function(e){if(!document.getElementById('lightbox').classList.contains('active'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowRight')lbNav(-1);if(e.key==='ArrowLeft')lbNav(1);});
        document.getElementById('lightbox').addEventListener('click',function(e){if(e.target===this)closeLightbox();});
        var ts=0,tx=0;
        document.getElementById('lightbox').addEventListener('touchstart',function(e){ts=e.touches[0].clientX;tx=0},{passive:true});
        document.getElementById('lightbox').addEventListener('touchmove',function(e){tx=e.touches[0].clientX-ts},{passive:true});
        document.getElementById('lightbox').addEventListener('touchend',function(){if(Math.abs(tx)>45)lbNav(tx>0?-1:1);});
    </script>
</body>
</html>
